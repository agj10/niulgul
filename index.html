<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f3ee" />
    <script>
      var theme = 'system';
      try {
        var savedTheme = localStorage.getItem('niulgul-theme');
        theme = savedTheme === 'light' || savedTheme === 'dark' ? savedTheme : 'system';
      } catch (_) {}
      try {
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.appearance = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#191d19' : '#f7f7f2';
      } catch (_) {}
    </script>
    <meta name="description" content="한 장의 이미지를, 원하는 얼굴로. 픽셀을 옮겨 만드는 niulgul." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>niulgul — 이미지를 얼굴로</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
